<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงทะเบียนจัดกลุ่มนิสิต</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-orange-50/50 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl border border-orange-100 p-6 md:p-8 space-y-6">
    
    <!-- ส่วนหัว: โลโก้ 3 ตัวจัดวางอยู่ตรงกลาง -->
    <div class="flex flex-col items-center space-y-4">
      <div class="flex justify-center items-center gap-4">
        <!-- เปลี่ยน URL รูปภาพโลโก้ของคุณที่นี่ได้เลยครับ -->
        <img src="https://scontent.fkkc3-1.fna.fbcdn.net/v/t39.30808-6/642768993_1941877609748834_2263063250765183521_n.jpg?stp=dst-jpg_tt6&cstp=mx2048x2048&ctp=s2048x2048&_nc_cat=109&ccb=1-7&_nc_sid=833d8c&_nc_eui2=AeFgdVRxMzDQoMn_WZ3PKav5HKXoF5YiSVocpegXliJJWomRnl3-W1ZkXpnF-IHRvyL-fqoXXFSj7bIqslzyZ2kK&_nc_ohc=yYASt5K_HFAQ7kNvwFXCG-o&_nc_oc=AdprLExm5EamUmN9Abu-lp2L37pMB0K7f_Md2yIsMH6AzuRZj9kQFDVoAm0RyclRoD8&_nc_zt=23&_nc_ht=scontent.fkkc3-1.fna&_nc_gid=LiDqaZAuaah-U54mrNQYBQ&_nc_ss=7b2a8&oh=00_AQA4V9J5OyRZFNDWeQOzSPeJbBM8Ft-5Ou-CxZ5PiOmAdw&oe=6A62B96B" alt="Logo 1" class="h-16 w-16 object-contain rounded-full shadow-sm border border-orange-200">
        <img src="https://scontent.fkkc3-1.fna.fbcdn.net/v/t39.30808-6/663053337_1971148600155068_3543915145222936824_n.jpg?stp=dst-jpg_tt6&cstp=mx2048x1449&ctp=s2048x1449&_nc_cat=110&ccb=1-7&_nc_sid=833d8c&_nc_eui2=AeH0Ylb-hwgqKTpvN3dV2BcaaZUZ0G2osN9plRnQbaiw339LeWYPMKzBDUJPM9YrxnTPMRu26kuL22h_IzA5vO7I&_nc_ohc=YYSBcff4D5YQ7kNvwGEujny&_nc_oc=AdrAguy5wuB84Udg7oYtHBsAW8M9UIocmVfBdStDM1wwNlkY45PkLMdKvHnkhznpgSY&_nc_zt=23&_nc_ht=scontent.fkkc3-1.fna&_nc_gid=MfpWNy4HDVaWVuSvmyIPaA&_nc_ss=7b2a8&oh=00_AQABq8W1zKOyxzk_Ak64RmkID5Si3Mbm_1vQAYNo6DSD7w&oe=6A629B98" alt="Logo 2" class="h-20 w-20 object-contain rounded-full shadow-md border-2 border-orange-400">
        <img src="https://scontent.fkkc3-1.fna.fbcdn.net/v/t39.30808-6/642355807_1941877579748837_136105529239050778_n.jpg?stp=dst-jpg_tt6&cstp=mx2048x2048&ctp=s2048x2048&_nc_cat=110&ccb=1-7&_nc_sid=833d8c&_nc_eui2=AeGoNuB4kdc4TXH0TTSJ2BniBfekBKi2L8kF96QEqLYvyV1eX4MSCorpCd_C4Kc1KUmZoO3IjylYjRUPPKxesC1I&_nc_ohc=bl8IF0KScDwQ7kNvwGnqR8u&_nc_oc=AdqSfQbPA-3Ejlp-WvldZGbXXmAJl-HOTNtVeZNd_rf3t3gbIv1wm5ZKfk5eHPcDwPQ&_nc_zt=23&_nc_ht=scontent.fkkc3-1.fna&_nc_gid=JCSL5N2VnPUhAEXUE9RiRw&_nc_ss=7b2a8&oh=00_AQCghOHomBO0-zld_7xxW9RlFrbX6pWwKIG_9BhR-AbD9Q&oe=6A62B8EB" class="h-16 w-16 object-contain rounded-full shadow-sm border border-orange-200">
      </div>
      <div class="text-center">
        <h1 class="text-2xl font-bold text-orange-600">ลงทะเบียนจัดกลุ่มนิสิต</h1>
        <p class="text-gray-500 text-sm mt-1">กรอกเลขท้าย 3 หลักเพื่อจับกลุ่ม (2-3 คน)</p>
      </div>
    </div>

    <!-- ฟอร์มลงทะเบียน -->
    <form id="groupForm" class="space-y-5">
      
      <!-- สมาชิกคนที่ 1 -->
      <div class="bg-orange-50/40 p-4 rounded-xl border border-orange-100">
        <label class="block text-sm font-semibold text-orange-800 mb-2">สมาชิกคนที่ 1 *</label>
        <div class="flex flex-col sm:flex-row gap-3">
          <input type="text" maxlength="3" data-member="1" required placeholder="เลขท้าย 3 หลัก เช่น 001" 
                 class="w-full sm:w-44 px-4 py-2.5 border border-orange-200 rounded-lg text-center font-bold tracking-wider focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
          <div class="flex-1 bg-white border border-dashed border-orange-200 rounded-lg px-4 py-2.5 flex items-center">
            <span id="name-1" class="text-gray-400 font-medium">-</span>
          </div>
        </div>
      </div>

      <!-- สมาชิกคนที่ 2 -->
      <div class="bg-orange-50/40 p-4 rounded-xl border border-orange-100">
        <label class="block text-sm font-semibold text-orange-800 mb-2">สมาชิกคนที่ 2 *</label>
        <div class="flex flex-col sm:flex-row gap-3">
          <input type="text" maxlength="3" data-member="2" required placeholder="เลขท้าย 3 หลัก เช่น 002" 
                 class="w-full sm:w-44 px-4 py-2.5 border border-orange-200 rounded-lg text-center font-bold tracking-wider focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
          <div class="flex-1 bg-white border border-dashed border-orange-200 rounded-lg px-4 py-2.5 flex items-center">
            <span id="name-2" class="text-gray-400 font-medium">-</span>
          </div>
        </div>
      </div>

      <!-- สมาชิกคนที่ 3 -->
      <div class="bg-orange-50/40 p-4 rounded-xl border border-orange-100">
        <label class="block text-sm font-semibold text-orange-800 mb-2">สมาชิกคนที่ 3 (ไม่บังคับ)</label>
        <div class="flex flex-col sm:flex-row gap-3">
          <input type="text" maxlength="3" data-member="3" placeholder="เลขท้าย 3 หลัก" 
                 class="w-full sm:w-44 px-4 py-2.5 border border-orange-200 rounded-lg text-center font-bold tracking-wider focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
          <div class="flex-1 bg-white border border-dashed border-orange-200 rounded-lg px-4 py-2.5 flex items-center">
            <span id="name-3" class="text-gray-400 font-medium">-</span>
          </div>
        </div>
      </div>

      <!-- ปุ่มส่งข้อมูล -->
      <button type="submit" id="submitBtn" 
              class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition transform active:scale-[0.98] flex items-center justify-center space-x-2">
        <span>บันทึกข้อมูลกลุ่ม</span>
      </button>

    </form>
  </div>

  <script>
    // ฐานข้อมูลนิสิตที่ระบบจดจำไว้
    const ROSTER = {
      "001":"นางสาวจิรัชญา หล่าโคตร์","002":"นางสาวจิรัชยา แสนวงษ์","004":"นางสาวณัฐธิดา บุญทวี","005":"นางสาวบุณยานุช สุขศรี","006":"นายปิยะวัฒน์ จงวัตร","007":"นางสาวพิชญา จันทา","008":"นายพีรพล ปานนพภา","009":"นายวรัท ยางกลาง","010":"นางสาวศุภิสรา จิตรเสงี่ยม","012":"นายปุญญพัตน์ เอี่ยมวอน","013":"นางสาวกชวรรณ เกลอสูงเนิน","014":"นายกนก รัตนา","015":"นางสาวกมลชนก เรืองธรรม","016":"นายกรกฤต พุฒลา","017":"นางสาวกฤษณา ไชยคุณ","018":"นางสาวกิ่งกาญจน์ จุลหงษ์","019":"นายกิตติธัช นิลไชย","020":"นายกิตติศักดิ์ โต๊ะจรัญ","021":"นายกิตติศักดิ์ สมปอง","022":"นางสาวจันทภา ทบพักตร์","023":"นายจิตติพัฒน์ เจริญสุข","025":"นางสาวจิรนันท์ สังข์วงศ์","026":"นางสาวฉัตรรพี วรรณพราหมณ์","027":"นางสาวชลดา ไหมน้ำคำ","028":"นางสาวชลธิชา เจริญขันธ์","029":"นางสาวชาลิสา สิงห์นา","030":"นางสาวฐิติวรดา อารมณ์เพียร","031":"นายณภัทร ชาแสน","032":"นายณัฐชัย มีชัย","033":"นายณัฐพล บุญเอก","034":"นางสาวทักษอร อินาลา","035":"นายธนดล สายสุด","037":"นายธีรภัทร แสนโทโพ","038":"นายธีรศักดิ์ ภารดิลก","039":"นายนนทภัทร สุทธิสน","040":"นางสาวนรินธร ใบพิมูล","041":"นางสาวนฤมล ต้นแก้ว","042":"นายนิธิ บุญพิมพ์","043":"นางสาวปภาวรินท์ งามสนิท","044":"นางสาวประภัสสร วันทองทักษ์","045":"นางสาวปุณณดา มงคลพิศ","046":"นางสาวพรนภัส พรมไชยา","047":"นางสาวพรรณวริสา ตรีสอน","048":"นายพรรษิษฐ์ กีรตินันท์กูล","049":"นางสาวพอเพียง บุญมั่ง","050":"นายพันธวัช อนุอัน","051":"นายพิชญปกรณ์ สุขแสวง","052":"นายพิเชฐ จำปาโท","053":"นายพิทวัส สาระรัตน์","054":"นางสาวพิมพ์ใจ ฉลาด","055":"นางสาวพิมพ์ชนก ทาแพงน้อย","056":"นางสาวพิมพ์ชนก ไขขุนทด","057":"นายพีรวัส ศรีชาหลวง","058":"นายภูเบศว์ แพงพุด","060":"นายยุทธชัย มาตขาว","061":"นายรัชพล ขวัญโพน","062":"นางสาววชิรญาณ์ พรหมโคตร","063":"นายศุภโชค บุญประเสริฐ","064":"นายสรณ์ศิริ ราชภักดิ์","065":"นางสาวสลิลทิพย์ ปัดสี","066":"นางสาวสุชานันท์ วิชามุข","067":"นางสาวสุพิชญา วิเชียรรมย์","069":"นางสาวอภิสุตา บุศดี","070":"นายอริย์ธัช อุฒาพยับ","071":"นายกนกพล คูณหาร","072":"นางสาวกัญญารัตน์ ภวภูตานนท์ฯ","073":"นางสาวกุลชา เศรษฐมาตย์","074":"นางสาวขวัญข้าว อุ่นพิกุล","075":"นางสาวจรรยพร ตันตีบ","076":"นางสาวจิดาภา อาศัยนา","078":"นายณัฐพล เกลี้ยงพร้อม","079":"นายธนภัทร อาษาธง","081":"นางสาวธิยากรณ์ ศรีคำ","082":"นายธีรธรรม บุญอำนวย","083":"นายนัทธพงศ์ งามเมืองปัก","084":"นายปิยวัฒน์ ภูพันนา","085":"นายพศุตม์ สัมพันธ์","086":"นางสาวพิรยากร ทิพมาตย์","087":"นายภควินทร์ ศิรินามมนตรี","088":"นายภูสิต สายจันทร์","089":"นางสาวมิ่งขวัญ ใจกล้า","090":"นางสาววิลาวัลย์ มาลาศรี","091":"นางสาวศิริยาภรณ์ นูพิมพ์","092":"นางสาวศุจีภรณ์ ซ่อนจันทร์","093":"นายสุรเดช แช่มมาลี"
    };
    const PREFIX = "68010511";
    
    // ⚠️ นำ URL เว็บแอปที่ได้จากขั้นตอนการ Deploy ใน Google Apps Script มาวางที่นี่
    const WEB_APP_URL = "ใส่_URL_WEB_APP_ของท่านตรงนี้";

    // ผูก Event ค้นหาชื่ออัตโนมัติเมื่อพิมพ์เลขท้าย 3 หลัก
    document.querySelectorAll('input[data-member]').forEach(input => {
      input.addEventListener('input', e => {
        const v = e.target.value.replace(/\D/g, ''); // กรองให้พิมพ์ได้เฉพาะตัวเลข
        e.target.value = v;
        
        const idx = e.target.dataset.member;
        const nameDisplay = document.getElementById(`name-${idx}`);
        
        if (v.length === 3) {
          const studentName = ROSTER[v];
          if (studentName) {
            nameDisplay.textContent = `${PREFIX}${v} - ${studentName}`;
            nameDisplay.className = "text-gray-800 font-medium flex-1";
          } else {
            nameDisplay.textContent = "❌ ไม่พบรหัสนิสิตนี้ในระบบ";
            nameDisplay.className = "text-red-500 font-medium flex-1";
          }
        } else {
          nameDisplay.textContent = "-";
          nameDisplay.className = "text-gray-400 font-medium flex-1";
        }
      });
    });

    // ตรวจสอบข้อมูลก่อนส่งฟอร์มและบันทึกลง Google Sheets
    document.getElementById('groupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const members = [];
      const checkedIds = new Set();
      let hasError = false;

      // รวบรวมข้อมูล
      for (let i = 1; i <= 3; i++) {
        const val = document.querySelector(`input[data-member="${i}"]`).value.trim();
        if (val !== "") {
          if (val.length !== 3 || !ROSTER[val]) {
            alert(`กรุณาตรวจสอบรหัสนิสิตคนที่ ${i} ให้ถูกต้องก่อนบันทึก`);
            hasError = true;
            break;
          }
          if (checkedIds.has(val)) {
            alert('❌ พบรหัสนิสิตซ้ำกันภายในกลุ่มเดียวกัน กรุณาตรวจสอบอีกครั้ง');
            hasError = true;
            break;
          }
          checkedIds.add(val);
          members.push({ id: PREFIX + val, name: ROSTER[val] });
        }
      }

      if (hasError) return;
      if (members.length < 2) {
        alert('❌ กลุ่มนิสิตต้องมีสมาชิกอย่างน้อย 2 คนครับ');
        return;
      }
      if (WEB_APP_URL === "https://script.google.com/macros/s/AKfycbzTs72NdmVf_Z-yhi30SYn6MlkdAkPkiFqwGpUnqOBj2NPShfCT5tEuq2fMAA06gQqY/exec") {
        alert('⚠️ อย่าลืมติดตั้งและใส่ URL ของ Google Web App ในโค้ดด้วยนะครับ');
        return;
      }

      // ปิดปุ่มระหว่างทำงานเพื่อป้องกันการกดเบิ้ล
      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังบันทึกข้อมูล...";

      const payload = {
        member1_id: members[0].id, member1_name: members[0].name,
        member2_id: members[1].id, member2_name: members[1].name,
        member3_id: members[2] ? members[2].id : '', member3_name: members[2] ? members[2].name : ''
      };

      try {
        // ส่งข้อมูลเข้าสู่ Google Sheets ผ่าน Apps Script Web App แบบแบบ asynchronous 
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors', // เพื่อความง่ายในการผ่านข้อจำกัด Cross-Origin ของเว็บบราวเซอร์
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert('🎉 บันทึกการจัดกลุ่มสำเร็จ ข้อมูลถูกส่งไปยัง Google Sheets เรียบร้อยแล้วครับ!');
        
        // เคลียร์ฟอร์ม
        document.getElementById('groupForm').reset();
        document.querySelectorAll('span[id^="name-"]').forEach(span => span.textContent = "-");
        
      } catch (error) {
        console.error(error);
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อกรุณาลองใหม่อีกครั้ง');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "บันทึกข้อมูลกลุ่ม";
      }
    });
  </script>
</body>
</html>
